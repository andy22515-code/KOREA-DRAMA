<!DOCTYPE html>
<html lang="zh-TW">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>維基百科 + AI 韓國影視卡司追蹤庫 (韓劇/韓國電影)</title>
 <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap">
 <style>
 :root {
 --bg: #0d1117;
 --card-bg: #161b22;
 --accent: #6366f1;
 --accent-hover: #4f46e5;
 --text: #c9d1d9;
 --muted: #8b949e;
 --border: #30363d;
 --success: #238636;
 --lead-tag: #e11d48;
 --cameo-tag: #8b5cf6;
 }
 * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Outfit', sans-serif; }
 body { background: var(--bg); color: var(--text); padding: 2rem; max-width: 1100px; margin: 0 auto; }

 /* 頂部設定列 */
 .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); padding: 1rem 1.5rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
 .row { display: flex; align-items: center; gap: 0.75rem; }
 input, select, button { padding: 0.6rem 0.9rem; border-radius: 6px; border: 1px solid var(--border); background: #0d1117; color: #fff; font-size: 0.9rem; }
 button { background: var(--accent); cursor: pointer; border: none; font-weight: 600; transition: background 0.2s; }
 button:hover { background: var(--accent-hover); }

 /* 查詢面板 */
 .search-panel { background: var(--card-bg); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 2rem; }
 .search-row { display: flex; gap: 0.5rem; margin-top: 1rem; }
 .search-row input { flex: 1; }

 /* 查詢結果預覽區 */
 .preview-box { margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px dashed var(--border); display: none; }
 .preview-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.2rem; }
 .cast-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin-top: 1rem; }
 .cast-card { background: #0d1117; padding: 0.8rem; border-radius: 6px; border: 1px solid var(--border); }
 .cast-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
 .role-name { font-weight: 700; color: #a5b4fc; font-size: 0.95rem; }
 .actor-name { font-size: 0.85rem; color: #e2e8f0; }
 .badge-lead { font-size: 0.7rem; background: var(--lead-tag); color: #fff; padding: 2px 6px; border-radius: 4px; }
 .badge-cameo { font-size: 0.7rem; background: var(--cameo-tag); color: #fff; padding: 2px 6px; border-radius: 4px; }
 .badge-sub { font-size: 0.7rem; background: #374151; color: #9ca3af; padding: 2px 6px; border-radius: 4px; }
 .desc { font-size: 0.78rem; color: var(--muted); margin-top: 6px; line-height: 1.35; }

 /* 個人觀看庫清單 */
 .watch-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1.5rem; margin-top: 1rem; }
 .saved-card { background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); padding: 1.2rem; }
 .loading { color: #fbbf24; display: none; margin-top: 0.6rem; font-size: 0.9rem; }

 /* 演員排行榜 */
 .ranking-section { background: var(--card-bg); padding: 1.5rem; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 2rem; }
 .ranking-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; margin-top: 1rem; }
 .ranking-card { background: #0d1117; padding: 0.9rem; border-radius: 6px; border: 1px solid var(--border); transition: transform 0.15s ease, border-color 0.15s ease; }
 .ranking-card:hover { transform: translateY(-2px); border-color: var(--accent); }
 .ranking-header { display: flex; align-items: center; gap: 0.75rem; }
 .rank-badge { font-size: 1.25rem; font-weight: bold; width: 32px; text-align: center; }
 .rank-num { font-size: 0.95rem; color: var(--muted); font-weight: 700; }
 .actor-info { flex: 1; min-width: 0; }
 .actor-name-title { font-weight: 700; color: #fff; font-size: 1rem; }
 .actor-role-list { font-size: 0.76rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
 .count-tag { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.4); padding: 2px 8px; border-radius: 999px; font-size: 0.8rem; font-weight: 600; white-space: nowrap; }
 .count-val { font-size: 1rem; font-weight: 700; color: #a5b4fc; }
 .bar-bg { background: #21262d; height: 5px; border-radius: 3px; margin-top: 8px; overflow: hidden; }
 .bar-fill { background: linear-gradient(90deg, #6366f1, #a855f7); height: 100%; border-radius: 3px; }

 /* 備取區樣式 */
 .backup-card { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 0.45rem 0.75rem; font-size: 0.82rem; display: flex; align-items: center; gap: 8px; transition: border-color 0.15s; }
 .backup-card:hover { border-color: var(--accent); }

 /* 批量匯入樣式 */
 textarea { width: 100%; padding: 0.8rem; border-radius: 6px; border: 1px solid var(--border); background: #0d1117; color: #fff; font-size: 0.9rem; line-height: 1.5; box-sizing: border-box; resize: vertical; }
 .progress-bar-bg { background: #21262d; height: 8px; border-radius: 4px; overflow: hidden; margin: 10px 0; }
 .progress-bar-fill { background: linear-gradient(90deg, #6366f1, #10b981); height: 100%; width: 0%; transition: width 0.3s; }
 .log-box { background: #0d1117; border: 1px solid var(--border); border-radius: 6px; padding: 0.8rem; max-height: 180px; overflow-y: auto; font-family: monospace; font-size: 0.82rem; margin-top: 10px; }
 </style>
</head>
<body>

 </div>

雲畫的月光
寄生上流"></textarea>

 <script>
 // --- 使用者狀態管理 ---
 let users = JSON.parse(localStorage.getItem('kdrama_ai_users') || '["預設使用者"]');
 let currentUser = localStorage.getItem('kdrama_ai_current_user') || users[0];
 document.getElementById('geminiKey').value = localStorage.getItem('gemini_api_key') || '';
 let currentParsedData = null;

 function saveKey() {
 localStorage.setItem('gemini_api_key', document.getElementById('geminiKey').value.trim());
 alert('Gemini API Key 已儲存！');
 }

 // 標準化作品名稱工具函數：去除季數或續集號碼後綴
 function getBaseTitle(title) {
 if (!title) return '';
 return title
 .replace(/\s*(?:第[一二三四五六七八九十\d]+季|Season\s*\d+|S\d+)\s*$/i, '')
 .replace(/[\s\-_]+(?:[1-9]|I{1,3}|IV|V)$/i, '')
 .trim() || title;
 }

 // 智慧儲存與跨季/續集歸併邏輯
 function saveDramaToUserList(dramaData) {
 const key = `user_list_${currentUser}`;
 let list = JSON.parse(localStorage.getItem(key) || '[]');
 
 const baseTitle = getBaseTitle(dramaData.canonical_title);
 const existingIdx = list.findIndex(d => getBaseTitle(d.canonical_title) === baseTitle);

 if (existingIdx !== -1) {
 const existing = list[existingIdx];
 const charMap = new Map();

 (existing.characters || []).forEach(c => {
 if (c.actor && c.actor.trim()) charMap.set(c.actor.trim(), c);
 });

 (dramaData.characters || []).forEach(c => {
 if (!c.actor || !c.actor.trim()) return;
 const actorKey = c.actor.trim();
 if (!charMap.has(actorKey)) {
 charMap.set(actorKey, c);
 } else {
 const oldC = charMap.get(actorKey);
 if (c.is_main_lead) oldC.is_main_lead = true;
 if (c.is_cameo) oldC.is_cameo = true;
 if (c.character && !oldC.character.includes(c.character)) {
 oldC.character = `${oldC.character} / ${c.character}`;
 }
 }
 });

 existing.canonical_title = baseTitle;
 existing.characters = Array.from(charMap.values());

 if (dramaData.broadcast_year && !String(existing.broadcast_year).includes(String(dramaData.broadcast_year))) {
 existing.broadcast_year = `${existing.broadcast_year}, ${dramaData.broadcast_year}`;
 }

 list[existingIdx] = existing;
 } else {
 dramaData.canonical_title = baseTitle;
 list.unshift(dramaData);
 }

 localStorage.setItem(key, JSON.stringify(list));
 }

 // --- 資料備份匯出與匯入 ---
 function exportData() {
 const backup = {
 users: users,
 currentUser: currentUser,
 geminiKey: localStorage.getItem('gemini_api_key') || '',
 data: {}
 };
 users.forEach(u => {
 const key = `user_list_${u}`;
 backup.data[u] = JSON.parse(localStorage.getItem(key) || '[]');
 });

 const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
 const url = URL.createObjectURL(blob);
 const a = document.createElement('a');
 a.href = url;
 a.download = `korean_media_backup_${new Date().toISOString().slice(0, 10)}.json`;
 a.click();
 URL.revokeObjectURL(url);
 }

 function importData(e) {
 const file = e.target.files?.[0];
 if (!file) return;

 const reader = new FileReader();
 reader.onload = (evt) => {
 try {
 const backup = JSON.parse(evt.target.result);
 if (!backup.users || !backup.data) throw new Error('備份檔格式不符');

 localStorage.setItem('kdrama_ai_users', JSON.stringify(backup.users));
 if (backup.currentUser) {
 localStorage.setItem('kdrama_ai_current_user', backup.currentUser);
 }
 if (backup.geminiKey) {
 localStorage.setItem('gemini_api_key', backup.geminiKey);
 document.getElementById('geminiKey').value = backup.geminiKey;
 }

 Object.keys(backup.data).forEach(u => {
 localStorage.setItem(`user_list_${u}`, JSON.stringify(backup.data[u]));
 });

 users = backup.users;
 currentUser = backup.currentUser || users[0];
 syncUsers();
 alert('資料匯入成功！已還原所有使用者與觀看紀錄。');
 } catch (err) {
 alert('匯入失敗：' + err.message);
 }
 };
 reader.readAsText(file);
 e.target.value = '';
 }

 function syncUsers() {
 const select = document.getElementById('userSelect');
 select.innerHTML = users.map(u => `<option value="${u}" ${u === currentUser ? 'selected' : ''}>${u}</option>`).join('');
 document.getElementById('watchlistHeader').innerText = `👤 ${currentUser} 的看過清單`;
 document.querySelectorAll('.current-user-name').forEach(el => el.innerText = currentUser);
 renderWatchlist();
 renderActorRanking();
 }

 function addUser() {
 const name = prompt('請輸入使用者名稱：');
 if (!name || users.includes(name)) return;
 users.push(name);
 localStorage.setItem('kdrama_ai_users', JSON.stringify(users));
 currentUser = name;
 localStorage.setItem('kdrama_ai_current_user', currentUser);
 syncUsers();
 }

 function switchUser() {
 currentUser = document.getElementById('userSelect').value;
 localStorage.setItem('kdrama_ai_current_user', currentUser);
 syncUsers();
 }

 // --- 動態尋找可用模型並呼叫 Gemini API ---
 async function callGeminiAPI(prompt, geminiKey) {
 let modelList = [];
 try {
 const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${geminiKey}`);
 const listData = await listRes.json();
 if (listData.error) {
 throw new Error(`Gemini API 報錯 (${listData.error.code}): ${listData.error.message}`);
 }
 if (listData.models && Array.isArray(listData.models)) {
 modelList = listData.models
 .filter(m => {
 const name = m.name.toLowerCase();
 const hasGen = m.supportedGenerationMethods && m.supportedGenerationMethods.includes('generateContent');
 const isNonText = name.includes('tts') || name.includes('audio') || name.includes('embed') || name.includes('imagen') || name.includes('realtime');
 return hasGen && !isNonText;
 })
 .map(m => m.name.replace(/^models\//, ''));
 }
 } catch (err) {
 if (err.message && err.message.includes('Gemini API 報錯')) throw err;
 }

 const priorityOrder = [
 'gemini-2.5-flash',
 'gemini-2.0-flash',
 'gemini-2.0-flash-lite',
 'gemini-1.5-pro',
 'gemini-2.5-pro',
 'gemini-1.5-flash-latest'
 ];
 const candidates = Array.from(new Set([
 ...priorityOrder,
 ...modelList.filter(m => m.includes('flash')),
 ...modelList
 ])).filter(name => !name.includes('tts') && !name.includes('audio') && !name.includes('embed'));

 let lastError = null;
 for (const model of candidates) {
 try {
 const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${geminiKey}`, {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({
 contents: [{ parts: [{ text: prompt }] }],
 generationConfig: { responseMimeType: "application/json" }
 })
 });

 const json = await res.json();
 if (json.error) {
 if (json.error.message && json.error.message.toLowerCase().includes('api key')) {
 throw new Error(`Gemini API Key 無效: ${json.error.message}`);
 }
 console.warn(`模型 ${model} 遇到錯誤 (${json.error.code}): ${json.error.message}，切換備用模型...`);
 lastError = new Error(`模型 ${model} (${json.error.code}): ${json.error.message}`);
 continue;
 }

 const candidate = json.candidates?.[0];
 if (!candidate || !candidate.content?.parts?.[0]?.text) {
 const reason = candidate?.finishReason || '未知原因';
 throw new Error(`AI 未回傳內容（原因: ${reason}）`);
 }

 let rawJsonText = candidate.content.parts[0].text.trim();
 rawJsonText = rawJsonText.replace(/^```json\s*/i, '').replace(/```\s*$/i, '').trim();
 return JSON.parse(rawJsonText);
 } catch (e) {
 lastError = e;
 if (e.message && e.message.includes('Gemini API Key 無效')) throw e;
 continue;
 }
 }
 throw lastError || new Error('所有可用 Gemini 模型皆請求失敗，請檢查 API Key 權限。');
 }

 // --- 切換單筆/批量模式 ---
 function switchInputMode(mode) {
 const singlePanel = document.getElementById('singleInputPanel');
 const batchPanel = document.getElementById('batchInputPanel');
 const singleBtn = document.getElementById('modeSingleBtn');
 const batchBtn = document.getElementById('modeBatchBtn');

 if (mode === 'single') {
 singlePanel.style.display = 'block';
 batchPanel.style.display = 'none';
 singleBtn.style.background = 'var(--accent)';
 batchBtn.style.background = '#21262d';
 } else {
 singlePanel.style.display = 'none';
 batchPanel.style.display = 'block';
 singleBtn.style.background = '#21262d';
 batchBtn.style.background = 'var(--accent)';
 }
 }

 // --- 核心邏輯：維基百科 API + 強制深度掃描綠葉的 AI Prompt ---
 async function fetchDramaData(query, geminiKey) {
 let title = "";
 try {
 const searchUrl = `https://zh.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query + ' 韓國電影 韓劇')}&utf8=&format=json&origin=*`;
 const sRes = await fetch(searchUrl);
 const sData = await sRes.json();
 title = sData.query?.search?.[0]?.title;
 } catch (e) {
 console.warn('專屬搜尋失敗:', e);
 }

 if (!title) {
 try {
 const fbRes = await (await fetch(`https://zh.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&utf8=&format=json&origin=*`)).json();
 title = fbRes.query?.search?.[0]?.title;
 } catch (e) {
 console.warn('原關鍵字搜尋失敗:', e);
 }
 }

 if (!title) title = query;

 let wikiText = '';
 try {
 const parseUrl = `https://zh.wikipedia.org/w/api.php?action=parse&page=${encodeURIComponent(title)}&prop=wikitext&format=json&origin=*`;
 const pRes = await fetch(parseUrl);
 const pData = await pRes.json();
 const rawWikitext = pData.parse?.wikitext?.['*'];
 if (rawWikitext) {
 wikiText = rawWikitext
 .replace(/\[\[(?:[^|\]]*\|)?([^\]]+)\]\]/g, '$1')
 .replace(/<!--[\s\S]*?-->/g, '')
 .slice(0, 18000);
 }
 } catch (e) {
 console.warn('Wikitext 獲取失敗', e);
 }

 if (!wikiText) {
 try {
 const contentUrl = `https://zh.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=true&titles=${encodeURIComponent(title)}&redirects=1&format=json&origin=*`;
 const cRes = await fetch(contentUrl);
 const cData = await cRes.json();
 const pages = cData.query?.pages;
 const pageId = Object.keys(pages || {})[0];
 wikiText = pages?.[pageId]?.extract?.slice(0, 14000) || '';
 } catch (e) {
 console.warn('Extract 獲取失敗', e);
 }
 }

 const prompt = `
你是一位專業韓國影視資料分析師（精通韓國電影與韓國電視劇/韓劇）。
作品名稱：《${title}》
以下是該韓國影視作品的維基百科內文（包含演員陣容表格與配角介紹）：
---
${wikiText || "無維基內文，請完全依靠你的韓國影視資料庫知識補齊。"}
---
請從中精確提取：
1. canonical_title: 標準中文作品名稱（如：${title}）
2. original_title: 韓文原文或英文名 (若有)
3. broadcast_year: 上映或播出年份（如：2016、2018、2019）
4. characters: 角色與演員陣容列表（請【務必地毯式完整收錄 20～30 人】）。

【嚴格指令：絕不漏掉黃金綠葉與配角】
請務必仔細掃描維基內文後方的「其他人物」、「主要配角」、「朝廷/組織成員」等段落！
絕對不能只抓男女主角。必須將知名實力派綠葉、反派、金牌配角、特別客串（例如在《鬼怪》中的金炳哲/朴仲憲、李伊/三神奶奶、趙祐鎮/金秘書；在《陽光先生》中的金炳哲、趙祐鎮等）全部完整抓出！

 - actor: 韓國演員本名（例如：金炳哲、李伊、趙祐鎮、孔劉、李棟旭）
 - character: 飾演的角色名稱（例如：朴仲憲、三神奶奶、金信）
 - is_main_lead: boolean (僅限排最前方的核心男女主角為 true，綠葉配角一律設為 false)
 - is_cameo: boolean (是否為特別出演 / 友情客串 / 特別客串)
 - short_desc: 角色的簡短設定或關係 (一句話)

請輸出合法的 JSON，格式如下：
{
 "canonical_title": "...",
 "original_title": "...",
 "broadcast_year": "...",
 "characters": [
 {"actor": "...", "character": "...", "is_main_lead": true, "is_cameo": false, "short_desc": "..."}
 ]
}
不要輸出任何 Markdown 語法或說明，只要純 JSON。
`;

 const parsed = await callGeminiAPI(prompt, geminiKey);
 parsed.id = Date.now();
 if (!parsed.characters || !Array.isArray(parsed.characters)) {
 parsed.characters = [];
 }
 return parsed;
 }

 // 單筆查詢處理
 async function searchAndParse() {
 const geminiKey = localStorage.getItem('gemini_api_key');
 if (!geminiKey) return alert('請先填寫並儲存 Gemini API Key！');

 const query = document.getElementById('queryInput').value.trim();
 if (!query) return;

 const loading = document.getElementById('loadingText');
 const previewBox = document.getElementById('previewBox');
 loading.style.display = 'block';
 previewBox.style.display = 'none';

 try {
 currentParsedData = await fetchDramaData(query, geminiKey);

 document.getElementById('prevTitle').innerText = currentParsedData.canonical_title;
 document.getElementById('prevSummary').innerText = `${currentParsedData.original_title || ''} • ${currentParsedData.broadcast_year || ''}`;

 document.getElementById('prevCastGrid').innerHTML = (currentParsedData.characters || []).map(c => {
 const isCameo = c.is_cameo === true || c.is_cameo === 'true';
 const isLead = c.is_main_lead === true || c.is_main_lead === 'true' || c.is_main_lead === 1;
 let badgeHtml = '<span class="badge-sub">配角</span>';
 if (isCameo) {
 badgeHtml = '<span class="badge-cameo">✨ 特別出演</span>';
 } else if (isLead) {
 badgeHtml = '<span class="badge-lead">主角/主演</span>';
 }

 return `
 <div class="cast-card">
 <div class="cast-header">
 <span class="role-name">${c.character || '未詳'}</span>
 ${badgeHtml}
 </div>
 <div class="actor-name">演員：${c.actor || '未標註'}</div>
 ${c.short_desc ? `<div class="desc">${c.short_desc}</div>` : ''}
 </div>
 `;
 }).join('');

 previewBox.style.display = 'block';

 } catch (err) {
 alert('解析失敗：' + err.message);
 } finally {
 loading.style.display = 'none';
 }
 }

 // 批量匯入處理
 let isBatchRunning = false;
 let shouldStopBatch = false;

 function stopBatchImport() {
 shouldStopBatch = true;
 }

 async function startBatchImport() {
 if (isBatchRunning) return;
 const geminiKey = localStorage.getItem('gemini_api_key');
 if (!geminiKey) return alert('請先填寫並儲存 Gemini API Key！');

 const rawInput = document.getElementById('batchInput').value.trim();
 if (!rawInput) return alert('請在文字框中輸入至少一部作品名稱！');

 const dramaNames = Array.from(new Set(
 rawInput.split(/[\n,，、;；]/)
 .map(s => s.trim().replace(/^[\d\.\-\*•\s]+/, ''))
 .filter(s => s.length > 0)
 ));

 if (!dramaNames.length) return alert('無法辨識到任何有效作品名稱！');

 const confirmMsg = `即將批量解析並加入 ${dramaNames.length} 部韓國電影/韓劇到「${currentUser}」的清單：\n\n${dramaNames.slice(0, 5).join('、')}${dramaNames.length > 5 ? '...等' : ''}\n\n是否開始？`;
 if (!confirm(confirmMsg)) return;

 isBatchRunning = true;
 shouldStopBatch = false;

 document.getElementById('batchStartBtn').disabled = true;
 document.getElementById('batchStopBtn').style.display = 'inline-block';
 document.getElementById('batchProgressBox').style.display = 'block';
 const logContainer = document.getElementById('batchLogList');
 logContainer.innerHTML = '';

 let successCount = 0;
 let failCount = 0;

 for (let i = 0; i < dramaNames.length; i++) {
 if (shouldStopBatch) {
 const stopItem = document.createElement('div');
 stopItem.style.color = '#f59e0b';
 stopItem.innerText = `⚠️ 已手動停止批量匯入。`;
 logContainer.prepend(stopItem);
 break;
 }

 const name = dramaNames[i];
 const progress = Math.round(((i) / dramaNames.length) * 100);
 document.getElementById('batchProgressBar').style.width = `${progress}%`;
 document.getElementById('batchProgressText').innerText = `正在處理 (${i + 1}/${dramaNames.length}): 《${name}》...`;

 try {
 const dramaData = await fetchDramaData(name, geminiKey);
 saveDramaToUserList(dramaData);

 successCount++;
 const logItem = document.createElement('div');
 logItem.style.color = '#34d399';
 logItem.style.marginBottom = '4px';
 logItem.innerText = `✅ [${i + 1}/${dramaNames.length}] 《${dramaData.canonical_title}》(${dramaData.broadcast_year || '年份未詳'}) 已收錄 ${(dramaData.characters || []).length} 名角色`;
 logContainer.prepend(logItem);

 renderWatchlist();
 renderActorRanking();

 } catch (err) {
 failCount++;
 const logItem = document.createElement('div');
 logItem.style.color = '#f87171';
 logItem.style.marginBottom = '4px';
 logItem.innerText = `❌ [${i + 1}/${dramaNames.length}] 《${name}》失敗: ${err.message}`;
 logContainer.prepend(logItem);
 }

 if (i < dramaNames.length - 1 && !shouldStopBatch) {
 await new Promise(r => setTimeout(r, 1200));
 }
 }

 document.getElementById('batchProgressBar').style.width = '100%';
 document.getElementById('batchProgressText').innerText = `批量匯入完成！成功 ${successCount} 部，失敗 ${failCount} 部。`;
 document.getElementById('batchStartBtn').disabled = false;
 document.getElementById('batchStopBtn').style.display = 'none';
 isBatchRunning = false;
 }

 function saveToCurrentWatchlist() {
 if (!currentParsedData) return;
 saveDramaToUserList(currentParsedData);

 alert(`已將《${currentParsedData.canonical_title}》收錄至 ${currentUser} 的看過清單！`);
 renderWatchlist();
 renderActorRanking();
 }

 function removeWatchItem(title) {
 const key = `user_list_${currentUser}`;
 let list = JSON.parse(localStorage.getItem(key) || '[]');
 const baseTitle = getBaseTitle(title);
 list = list.filter(d => getBaseTitle(d.canonical_title) !== baseTitle);
 localStorage.setItem(key, JSON.stringify(list));
 renderWatchlist();
 renderActorRanking();
 }

 // --- 計算並渲染演員出現頻率排行榜與主演備取區 (採用角色權重積分制：主演 8分 • 配角 4分 • 客串 2分) ---
 function renderActorRanking(isManual = false) {
 const key = `user_list_${currentUser}`;
 const list = JSON.parse(localStorage.getItem(key) || '[]');
 const container = document.getElementById('actorRankingGrid');
 const section = document.getElementById('actorRankingSection');
 const statusText = document.getElementById('rankStatusText');
 const rankHeader = document.getElementById('rankingHeader');
 const limitSelect = document.getElementById('rankLimitSelect');
 if (!container || !section) return;

 if (!list.length) {
 section.style.display = 'none';
 return;
 }

 const limit = parseInt(limitSelect?.value || '35', 10);
 const limitTitleText = limit === 999 ? '全部演員' : `Top ${limit}`;
 if (rankHeader) rankHeader.innerText = `🏆 ${currentUser} 的韓國演員常客 ${limitTitleText}`;

 const actorMap = {};

 list.forEach(drama => {
 if (!drama.characters || !Array.isArray(drama.characters)) return;
 const seenInThisDrama = new Set();
 const rawTitle = drama.canonical_title || '';
 const baseTitle = getBaseTitle(rawTitle);

 drama.characters.forEach(c => {
 const actor = (c.actor || '').trim();
 if (!actor || actor === '未標註' || seenInThisDrama.has(actor)) return;
 seenInThisDrama.add(actor);

 const isLead = c.is_main_lead === true || c.is_main_lead === 'true' || c.is_main_lead === 1;
 const isCameo = c.is_cameo === true || c.is_cameo === 'true';

 if (!actorMap[actor]) {
 actorMap[actor] = {
 actor: actor,
 seriesMap: {}
 };
 }

 if (!actorMap[actor].seriesMap[baseTitle]) {
 actorMap[actor].seriesMap[baseTitle] = {
 baseTitle: baseTitle,
 seasons: [],
 isLead: false,
 isCameo: false,
 roles: new Set()
 };
 }

 const sObj = actorMap[actor].seriesMap[baseTitle];
 sObj.seasons.push(rawTitle);
 if (c.character) sObj.roles.add(c.character);
 if (isLead) sObj.isLead = true;
 if (isCameo) sObj.isCameo = true;
 });
 });

 const sorted = Object.values(actorMap).map(item => {
 const seriesList = Object.values(item.seriesMap);
 const count = seriesList.length;
 const leadCount = seriesList.filter(s => s.isLead).length;
 const cameoCount = seriesList.filter(s => s.isCameo).length;
 const suppCount = count - leadCount - cameoCount;

 // 💡 方案 A 權重積分：主演 8 分、配角 4 分、特別客串 2 分
 const score = (leadCount * 8) + (suppCount * 4) + (cameoCount * 2);
 
 const dramasDetail = seriesList.map(s => {
 const roleStr = Array.from(s.roles).join('/') || '未詳';
 const tag = s.isLead ? ' (主)' : (s.isCameo ? ' (客)' : '');
 return `《${s.baseTitle}》${roleStr}${tag}`;
 });

 return {
 actor: item.actor,
 count: count,
 leadCount: leadCount,
 cameoCount: cameoCount,
 score: score,
 dramas: dramasDetail
 };
 }).sort((a, b) => {
 if (b.score !== a.score) return b.score - a.score;
 if (b.count !== a.count) return b.count - a.count;
 return b.leadCount - a.leadCount;
 });

 const topList = sorted.slice(0, limit);
 if (!topList.length) {
 section.style.display = 'none';
 return;
 }

 section.style.display = 'block';
 if (statusText) {
 statusText.innerText = `已統計 ${list.length} 部韓國影視作品 (${new Date().toLocaleTimeString()} 刷新)`;
 statusText.style.color = isManual ? '#818cf8' : 'var(--muted)';
 }
 const medals = ['🥇', '🥈', '🥉'];
 const maxScore = topList[0].score || 1;

 container.innerHTML = topList.map((item, idx) => {
 const rank = idx + 1;
 const medalOrNum = idx < 3 ? medals[idx] : `<span class="rank-num">#${rank}</span>`;
 const rolesDetail = item.dramas.join('、');
 const cameoStr = item.cameoCount > 0 ? ` • 客串 ${item.cameoCount} 次` : '';

 return `
 <div class="ranking-card" title="${rolesDetail}">
 <div class="ranking-header">
 <div class="rank-badge">${medalOrNum}</div>
 <div class="actor-info">
 <div class="actor-name-title">${item.actor}</div>
 <div class="actor-role-list">${rolesDetail}</div>
 </div>
 <div class="count-tag">
 <span class="count-val">${item.score}</span> 分
 </div>
 </div>
 <div class="bar-bg">
 <div class="bar-fill" style="width: ${(item.score / maxScore) * 100}%;"></div>
 </div>
 <div style="font-size:0.75rem; color:var(--muted); margin-top:6px; display:flex; justify-content:space-between;">
 <span>主演 ${item.leadCount} 次${cameoStr}</span>
 <span>共 ${item.count} 部作品</span>
 </div>
 </div>
 `;
 }).join('');

 // --- 渲染：主演備取區 ---
 const topNames = new Set(topList.map(a => a.actor));
 const backupLeads = sorted.filter(a => a.leadCount >= 1 && !topNames.has(a.actor));
 const backupSection = document.getElementById('leadBackupSection');
 const backupGrid = document.getElementById('leadBackupGrid');
 const backupCountTag = document.getElementById('backupCountTag');
 const backupSubTitle = document.getElementById('backupSubTitle');

 if (backupSection && backupGrid) {
 backupSection.style.display = 'block';
 if (backupSubTitle) backupSubTitle.innerText = `（曾主演過但未擠進 ${limitTitleText}）`;

 if (backupLeads.length > 0) {
 if (backupCountTag) backupCountTag.innerText = `共 ${backupLeads.length} 位`;

 backupGrid.innerHTML = backupLeads.map(item => {
 const rolesDetail = item.dramas.join('、');
 const cameoStr = item.cameoCount > 0 ? ` • 客串 ${item.cameoCount}` : '';
 return `
 <div class="backup-card" title="${rolesDetail}">
 <span style="color:#fff; font-weight:600;">${item.actor}</span>
 <span style="font-size:0.72rem; color:#e11d48; background:rgba(225,29,72,0.12); padding:1px 5px; border-radius:4px;">主演 ${item.leadCount} 次${cameoStr}</span>
 <span style="font-size:0.72rem; color:var(--muted);">${item.score} 分 (共 ${item.count} 部)</span>
 </div>
 `;
 }).join('');
 } else {
 if (backupCountTag) backupCountTag.innerText = `0 位`;
 backupGrid.innerHTML = `
 <p style="font-size:0.8rem; color:var(--muted); font-style:italic;">
 💡 目前所有主演皆已收錄在 ${limitTitleText} 排行榜中！
 </p>
 `;
 }
 }
 }

 async function reparseDrama(title) {
 const geminiKey = localStorage.getItem('gemini_api_key');
 if (!geminiKey) return alert('請先填寫並儲存 Gemini API Key！');

 const originalBtn = event?.target;
 if (originalBtn) originalBtn.innerText = '⏳ 解析中...';

 try {
 const newData = await fetchDramaData(title, geminiKey);
 saveDramaToUserList(newData);
 renderWatchlist();
 renderActorRanking();
 alert(`《${title}》已重新解析完成！`);
 } catch (err) {
 alert(`重新解析失敗: ${err.message}`);
 renderWatchlist();
 }
 }

 function parseYearNum(yStr) {
 if (!yStr) return 0;
 const match = String(yStr).match(/\d{4}/);
 return match ? parseInt(match[0], 10) : 0;
 }

 function renderWatchlist() {
 const key = `user_list_${currentUser}`;
 let list = JSON.parse(localStorage.getItem(key) || '[]');
 const container = document.getElementById('watchlistGrid');

 if (!list.length) {
 container.innerHTML = `<p style="color:var(--muted);">${currentUser} 尚未記錄任何韓國電影或韓劇。</p>`;
 return;
 }

 const sortVal = document.getElementById('watchlistSortSelect')?.value || 'year_desc';
 list.sort((a, b) => {
 const yA = parseYearNum(a.broadcast_year);
 const yB = parseYearNum(b.broadcast_year);
 if (sortVal === 'year_desc') return yB - yA;
 if (sortVal === 'year_asc') return yA - yB;
 if (sortVal === 'created_desc') return (b.id || 0) - (a.id || 0);
 return 0;
 });

 container.innerHTML = list.map(d => {
 const charList = d.characters || [];
 const leads = charList.filter(c => c.is_main_lead).map(c => `${c.actor} (${c.character})`).join('、');
 const isZero = charList.length === 0;

 return `
 <div class="saved-card" style="${isZero ? 'border: 1px solid #f59e0b;' : ''}">
 <div style="display:flex; justify-content:space-between; align-items:flex-start;">
 <h4>${d.canonical_title}</h4>
 <div style="display:flex; gap:6px; align-items:center;">
 <button onclick="reparseDrama('${d.canonical_title}')" title="重新擷取卡司陣容" style="background:#21262d; border:1px solid var(--border); color:#a5b4fc; font-size:0.75rem; padding:2px 8px; cursor:pointer;">🔄 重抓</button>
 <button onclick="removeWatchItem('${d.canonical_title}')" style="background:transparent; color:#ef4444; padding:0; cursor:pointer;">刪除</button>
 </div>
 </div>
 <p style="font-size:0.8rem; color:var(--muted); margin: 4px 0 8px 0;">${d.broadcast_year || '年份未詳'}</p>
 <div style="font-size:0.85rem; line-height:1.4;">
 <span style="color:#a5b4fc; font-weight:600;">主演：</span>${leads || (isZero ? '<span style="color:#f59e0b;">（名單缺失）</span>' : '未標註')}<br>
 <span style="color:${isZero ? '#f59e0b' : 'var(--muted)'};">共收錄 ${charList.length} 名角色</span>
 ${isZero ? `
 <div style="margin-top:8px;">
 <button onclick="reparseDrama('${d.canonical_title}')" style="background:#6366f1; color:#fff; border:none; padding:4px 10px; border-radius:4px; font-size:0.8rem; cursor:pointer; width:100%;">
 🔄 點此一鍵重新抓取角色名單
 </button>
 </div>
 ` : ''}
 </div>
 </div>
 `;
 }).join('');
 }

 syncUsers();
 </script>
